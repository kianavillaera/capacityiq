[tool:pytest]
testpaths = tests
addopts   = --tb=short -q

[coverage:run]
source    = src
omit      =
    */tests/*
    src/pipeline.py
    src/report_generator.py

[coverage:report]
show_missing = true
precision    = 1
fail_under   = 70
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.

[mutmut]
paths_to_mutate = src/reconciliation.py,src/mappings.py,src/transformations.py
runner         = /home/mabdelhameed2/CIQ/.venv/bin/python -m pytest tests/ -x -q
